baseURL = "http://example.org/"
locale = "en-us"
title = "Ezhil"
theme = "ezhil"

copyright = "© Copyright notice"

summaryLength = 20

[pagination]
  pagerSize = 5

# Syntax highlighting.
[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "solarized-dark"
  guessSyntax = true
  noClasses = true

[services.disqus]
  shortname = "ezhil-demo"

# [services.googleAnalytics]
#   ID = "G-XXXXXXXXXX"

[params]
	subtitle = "Clean and minimal personal [blog theme for Hugo](https://github.com/vividvilla/ezhil)"
	disableDisqusTypes = ["page"]
	featherIconsCDN = true
	mode = "auto" # "dark", "auto", "light"
	# disableThemeSwitcher = true  # Hide the light/dark toggle, keep `mode` fixed.
	# favicon = "favicon.png"  # Path relative to the static directory.
	# customCSS = "css/custom.css"  # Custom CSS applied to default styles.
	# customDarkCSS = "css/custom-dark.css"  # Custom styles applied to dark mode css.
	# customJS = ["https://code.jquery.com/jquery-3.4.1.js", "js/custom1.js"]  # Custom JS scripts.

[[params.social]]
name = "Github"
icon = "github"
url = "https://github.com/vividvilla/ezhil"

[[params.social]]
name = "RSS"
icon = "rss"
url = "/index.xml"

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "All posts"
url = "/posts"
weight = 2

[[menu.main]]
name = "About"
url = "/about"
weight = 3

[[menu.main]]
name = "Tags"
url = "/tags"
weight = 4

[taxonomies]
  tag = "tags"
